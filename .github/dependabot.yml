# Dependabot version updates.
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 10

  # Workflow actions are pinned to commit SHAs; this keeps the pins (and
  # their version comments) current.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  # Base images in the Dockerfile are pinned by digest; this bumps them.
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
