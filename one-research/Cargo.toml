[package]
name = "one-research"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[[bin]]
name = "one-research"
path = "src/main.rs"

[dependencies]
log = "0.4"
env_logger = "0.11"
dirs = "5"
ratatui = "0.29"
crossterm = "0.28"
reqwest = { version = "0.12", features = ["blocking", "json"] }
base64 = "0.22"
quick-xml = "0.36"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
arboard = "3"
chrono = { version = "0.4", features = ["serde"] }
notes = { path = "../crates/notes" }
chat = { path = "../crates/chat" }
one-research-http = { path = "../crates/http" }
# Tread — v1 arXiv reader, embedded as a library.  Pinned to an exact
# commit so a fresh clone (CI, Docker, `cargo install --git`) builds
# reproducibly.  To build against a local tread checkout instead, add a
# `[patch."https://github.com/VictoryChianumba/tread"]` entry to your
# own ~/.cargo/config.toml — see README "Development".  Replaced
# cli-text-reader during the migration (S4–S9).
tread = { git = "https://github.com/VictoryChianumba/tread", rev = "6710030d1b3df35df007fc0995de61bffe49f2ba" }
ui-theme = { path = "../crates/ui-theme" }
syntect = "5"
readability = "0.3"
url = "2"
textwrap = "0.16"
regex = "1"
html2text = "0.15"
pulldown-cmark = "0.12"
nucleo = "0.5"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
